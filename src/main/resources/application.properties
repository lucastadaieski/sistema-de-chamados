# As credenciais ficam no arquivo .env (fora do Git). Modelo: .env.example

server.port=8081
spring.config.import=optional:file:.env[.properties]

# MongoDB Atlas: banco próprio do microsserviço (coleção "chamados")
spring.data.mongodb.uri=${MONGODB_URI}
# MongoDB Atlas: mesmo banco do Login Seguro (o ThinDesk só usa a coleção "chamados")
spring.data.mongodb.database=${MONGODB_DATABASE:loginseguro}

# Chave secreta do token JWT: a MESMA configurada no Login Seguro
app.jwt.segredo=${JWT_SECRET}

# Mostra a mensagem dos erros na resposta JSON
server.error.include-message=always
